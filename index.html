<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview Expired</title>
<style>
  :root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--muted:#5b6578;--accent:#0b6bcb;--line:#e1e6ef}
  @media (prefers-color-scheme: dark){:root{--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--muted:#9aa6b8;--accent:#5aa9ff;--line:#2a3442}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
       background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px;text-align:center}
  .icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent);
        display:flex;align-items:center;justify-content:center}
  h1{font-size:21px;margin:0 0 8px}
  p{margin:0 0 12px;color:var(--muted)}
  .code{margin-top:20px;font-size:12px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Preview access has expired</h1>
    <p>This private preview of the PodiatryMeetings app is no longer available.</p>
    <p>Please contact Alec to get access to the latest version.</p>
    <div class="code">PREVIEW EXPIRED</div>
  </div>
</body>
</html>
