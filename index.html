<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Podiatry Meetings App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800;9..40,900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: phone-shell app in PodiatryMeetings.com brand — magenta→plum gradient strip, stacked purple wordmark, blush surfaces, concentric-circle motif; fixed bottom tab bar. Sponsor slots are native parts of each screen. */
:root{
  --ink:#111827; --ink-2:#374151; --muted:#6B6475;
  --bg:#FBF2F6; --surface:#FFFFFF; --line:#EAD9E4;
  --brand:#503E78; --plum:#6F146C; --magenta:#D40258; --deep:#4A0C48;
  --grad:linear-gradient(90deg,#D40258 0%,#6F146C 100%);
  --accent:#D40258; --teal:#1B8787; --teal-soft:#DFEFEF; --live:#1B8787;
  --ad:#F5ECF5; --ad-line:#E2C5D2; --on-grad:#FFFFFF;
  --f-display:"Museo Sans","DM Sans", system-ui, sans-serif;
  --f-body:"Museo Sans","DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#F7EEF5; --ink-2:#DCCBD8; --muted:#A894A6;
  --bg:#170B17; --surface:#24132A; --line:#3A2340;
  --brand:#C9B8F0; --plum:#C46BC1; --magenta:#FF4D8F; --deep:#2A0F29;
  --accent:#FF4D8F; --teal:#4FC1C1; --teal-soft:#123433; --live:#2FA3A3;
  --ad:#2E1530; --ad-line:#5A2D55; color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#F7EEF5; --ink-2:#DCCBD8; --muted:#A894A6;
  --bg:#170B17; --surface:#24132A; --line:#3A2340;
  --brand:#C9B8F0; --plum:#C46BC1; --magenta:#FF4D8F; --deep:#2A0F29;
  --accent:#FF4D8F; --teal:#4FC1C1; --teal-soft:#123433; --live:#2FA3A3;
  --ad:#2E1530; --ad-line:#5A2D55; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);
  border-bottom:1px solid var(--line);overflow:hidden}
.strip{background:var(--grad);color:#fff;font-size:11.5px;padding:5px 16px}
.strip b{font-weight:800}
.brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1;padding:10px 16px 12px}
header.top::after{content:"";position:absolute;right:-70px;top:-40px;width:230px;height:230px;border-radius:50%;
  background:repeating-radial-gradient(circle, transparent 0 18px, var(--line) 18px 19px);pointer-events:none;opacity:.8}
.wordmark{font-family:var(--f-display);font-weight:900;color:var(--brand);line-height:.86;letter-spacing:-.02em;font-size:19px;margin:0}
.wordmark span{display:block}
.wordmark small{display:block;font-size:11px;font-weight:800;letter-spacing:0;margin-top:2px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;color:#fff;font-size:15px;flex:none}
.adtoggle{margin-left:auto;background:var(--surface);border:1.5px solid var(--plum);color:var(--plum);
  border-radius:4px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;position:relative;z-index:1}
.adtoggle[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}

main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}

/* Sponsor slots */
.slot{position:relative}
.slot-tag{display:none;position:absolute;top:-9px;left:10px;z-index:2;background:var(--grad);color:#fff;
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.03em}
body.show-slots .slot{outline:2px dashed var(--accent);outline-offset:3px;border-radius:12px}
body.show-slots .slot-tag{display:block}
.presented{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.presented b{color:var(--ink)}
.logo-ph{width:36px;height:36px;border-radius:8px;background:var(--ad);border:1px solid var(--ad-line);
  display:grid;place-items:center;font-weight:800;font-family:var(--f-display);color:var(--ink-2);font-size:13px;flex:none}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:11px 12px;font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;
  font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
h2{color:var(--ink)}
.date{background:var(--ad)!important}
.date .d{color:var(--plum)}
.badge.ce{background:var(--plum)!important}
.cta{background:var(--grad)!important;color:#fff!important;border-radius:4px!important}
.btn{border-radius:4px!important}
.btn.primary{background:var(--grad)!important;color:#fff!important;border-color:transparent!important}
.star.on{color:var(--magenta)!important}
.save[aria-pressed="true"]{color:var(--magenta)!important}
body.show-slots .slot{outline-color:var(--magenta)!important}
.tab[aria-selected="true"] svg{color:var(--magenta)!important}
:focus-visible{outline-color:var(--magenta)!important}

.list{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.date{border-radius:10px;background:var(--bg);text-align:center;padding:6px 0;font-family:var(--f-mono)}
.date .m{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.date .d{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.ev-body{min-width:0}
.ev-title{font-weight:700;font-size:15px;line-height:1.3}
.ev-meta{font-size:13px;color:var(--muted);margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--ink-2)}
.badge.live{background:var(--live);color:#fff}
.badge.ce{background:var(--teal);color:#fff}
.badge.intl{border:1px solid var(--line);background:transparent}
.save{background:none;border:none;cursor:pointer;padding:4px;font-size:20px;line-height:1;color:var(--muted)}
.save[aria-pressed="true"]{color:var(--accent)}

.sponsored{background:var(--ad);border:1px solid var(--ad-line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.sponsored .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sponsored .t{font-weight:700;margin-top:2px}
.sponsored .s{font-size:13px;color:var(--ink-2)}
.cta{display:inline-block;margin-top:8px;background:var(--ink);color:var(--bg);border:none;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}

.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.hero-card .num{font-family:var(--f-display);font-weight:900;color:var(--magenta);font-size:34px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}

/* Detail sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,15,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-inner{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.close{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer;flex:none}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid}
.fact{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.fact:first-child{border-top:none}
.fact span:first-child{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact span:last-child{min-width:0;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border-radius:10px;padding:12px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:#3A2700;border-color:var(--accent)}

/* Rating */
.stars{display:flex;gap:6px}
.star{font-size:28px;background:none;border:none;cursor:pointer;color:var(--line);padding:0}
.star.on{color:var(--accent)}
select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.review .who{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}

.article{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.article .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.article .t{font-weight:700;margin-top:2px}
.partners{display:flex;flex-wrap:wrap;gap:8px}
.partners span{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:none;border-radius:7px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sum .row{display:flex;justify-content:space-between;gap:12px}
.sum .row span:last-child,.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800;font-size:15px}
.sum .tot span:last-child{color:var(--magenta)}
.slotcard{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.slotcard .L{width:38px;height:38px;border-radius:8px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.slotcard .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.buy{text-decoration:none;display:inline-block;border:1.5px solid var(--plum);color:var(--plum);background:var(--surface);border-radius:4px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--plum);font-variant-numeric:tabular-nums}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--ad);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--grad);border-radius:5px}
.bar .money{text-align:right}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{border-top:none;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tbl td.money{text-align:right}
.pricegrid{display:grid;grid-template-columns:1fr 92px;gap:6px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px}
.pricegrid input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-family:var(--f-mono);text-align:right}
.pricegrid h4{grid-column:1/-1;margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--plum)}
.status{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal)}
.paid{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;font-size:28px;margin:4px auto 0}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--magenta);background:var(--ad)}
.seg2{grid-template-columns:1fr 1fr}
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead b{font-family:var(--f-display);font-size:17px}
.calnav{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cday{aspect-ratio:1/1;max-width:100%;border:none;border-radius:9px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cday.out{visibility:hidden}
.cday.has{background:var(--ad)}
.cday.today{outline:1.5px solid var(--plum);outline-offset:-1.5px}
.cday[aria-pressed="true"]{background:var(--grad);color:#fff}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--magenta)}
.cday[aria-pressed="true"] .dots i{background:#fff}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.badge.virt{background:var(--teal-soft);color:var(--teal)}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;color:#fff;display:grid;place-items:center;
  background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.12) 0 18%,transparent 19%),repeating-radial-gradient(circle at 70% 30%,transparent 0 22px,rgba(255,255,255,.07) 22px 23px),linear-gradient(135deg,#4A0C48,#6F146C 55%,#D40258)}
.player .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;border:none;color:#fff;cursor:pointer}
.player .pb{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:#D40258;color:#fff}
.player .pb.rec{background:rgba(0,0,0,.45)}
.player .ps{position:absolute;top:10px;right:10px;font-size:11.5px;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px;color:#fff}
.player .pcap{position:absolute;bottom:10px;left:12px;right:12px;font-size:12.5px;opacity:.9;color:#fff}
.sheet-inner > *{flex-shrink:0}
.player > .slot{position:absolute;left:10px;right:10px;bottom:10px}
.preroll{background:rgba(255,255,255,.95);color:#111827;border-radius:10px;padding:8px 10px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.qa{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.up{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 0;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.up[aria-pressed="true"]{border-color:var(--magenta);color:var(--magenta)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.vote{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;color:var(--ink);position:relative;overflow:hidden}
.vote .fillbar{position:absolute;inset:0 auto 0 0;background:var(--ad);z-index:0}
.vote span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}
.vote[aria-pressed="true"]{border-color:var(--magenta)}
.chatline{font-size:14px}.chatline b{color:var(--plum)}
.leadbox{background:var(--ad);border:1px solid var(--ad-line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.prem{border:1px dashed var(--magenta);border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;margin:0;min-width:0}
.prem legend{font-size:12px;font-weight:700;color:var(--magenta);padding:0 4px}
.prem:disabled{opacity:.5;border-color:var(--line)}
.prem:disabled legend{color:var(--muted)}
.prem input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;min-width:0}
.tab{background:none;border:none;cursor:pointer;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--teal)}
.note{font-size:12.5px;color:var(--muted)}
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.post{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.post.feat{border:1.5px solid var(--magenta);box-shadow:0 2px 10px rgba(212,2,88,.08)}
.post-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.post-title{font-weight:700;font-size:15px;line-height:1.3;min-width:0}

.letter .re{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--plum)}
.letter .lt{font-weight:800;font-size:15.5px;line-height:1.3}

.badge.vet{background:#E8F5EE;color:#17663F}
.reply{border-left:3px solid var(--line);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:3px}

.pollbar i{position:absolute;inset:0 auto 0 0;background:var(--blush,#FBF2F6);z-index:0}
.pollbar span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}
.rules{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.badge.feat{background:var(--grad);color:#fff}
.newbtn{border:none;border-radius:4px;background:var(--grad);color:#fff;font-weight:700;padding:9px 14px;cursor:pointer;font-size:13.5px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.tier{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tier label{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.tier label:has(input:checked){border-color:var(--magenta);background:var(--ad)}
.tier b{display:block;font-size:14px}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const isLive=e=>pd(e.s)<=today&&today<=pd(e.e);
const daysTo=e=>Math.round((pd(e.s)-today)/864e5);
const range=e=>{const a=pd(e.s),b=pd(e.e);return e.s===e.e?`${MON[a.getMonth()]} ${a.getDate()}`:`${MON[a.getMonth()]} ${a.getDate()}–${a.getMonth()===b.getMonth()?"":MON[b.getMonth()]+" "}${b.getDate()}`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let saved=new Set(store.get("pm_saved2",[36108,36988]));
let state={tab:store.get("pm_tab","meetings"),filter:"all",q:""};

const slot=(label,html)=>`<div class="slot"><span class="slot-tag">${label}</span>${html}</div>`;
const sponsorCard=(label,kicker,title,sub,cta)=>slot(label,`<div class="sponsored"><div class="logo-ph">AD</div><div style="min-width:0"><div class="k">${kicker}</div><div class="t">${title}</div><div class="s">${sub}</div><button class="cta" data-ad>${cta}</button></div></div>`);

function evRow(e){
  const a=pd(e.s),on=saved.has(e.id),b=[];
  if(isLive(e))b.push('<span class="badge live">Happening now</span>');
  else if(daysTo(e)>0&&daysTo(e)<=7)b.push(`<span class="badge">In ${daysTo(e)} day${daysTo(e)>1?"s":""}</span>`);
  if(e.cech)b.push(`<span class="badge ce">${e.cech} CECH</span>`);
  if(e.intl)b.push('<span class="badge intl">International</span>');
  if(e.virt)b.push('<span class="badge virt">Virtual</span>');
  return `<div class="ev" data-open="${e.id}" role="button" tabindex="0">
    <div class="date"><div class="m">${MON[a.getMonth()]}</div><div class="d">${a.getDate()}</div></div>
    <div class="ev-body"><div class="ev-title">${esc(e.t)}</div><div class="ev-meta">${range(e)} · ${esc(e.city)}, ${esc(e.st)}</div>${b.length?`<div class="badges">${b.join("")}</div>`:""}</div>
    <button class="save" data-save="${e.id}" aria-pressed="${on}" aria-label="${on?"Remove from":"Save to"} My Meetings">${on?"★":"☆"}</button></div>`;

  return EVENTS.filter(e=>{
    if(pd(e.e)<today)return false;
    const q=state.q.trim().toLowerCase();
    if(q&&!(`${e.t} ${e.city} ${e.st}`.toLowerCase().includes(q)))return false;
    if(state.filter==="week")return daysTo(e)<=7;
    if(state.filter==="us")return !e.intl;
    if(state.filter==="intl")return !!e.intl;
    if(state.filter==="ce")return !!e.cech;
    return true;
  });
}

function quote(kind,tier,lines,photos){
  const P=PRICES[kind],hi=tier==="hi",inclL=hi?P.freeLines*2:P.freeLines,inclP=hi?P.hiPhotos:P.freePhotos;
  const xl=Math.max(0,lines-inclL),xp=Math.max(0,photos-inclP),items=[[hi?`Highlighted listing · ${P.days.hi} days`:`Free listing · ${P.days.free} days`,hi?+P.hiFee:0]];
  if(xl)items.push([`${xl} extra line${xl>1?"s":""} × ${fmt(P.line)}`,xl*P.line]);
  if(xp)items.push([`${xp} extra photo${xp>1?"s":""} × ${fmt(P.photo)}`,xp*P.photo]);
  return {items,total:items.reduce((s,i)=>s+i[1],0),inclL,inclP};
}

  if(!t)return;
  if(t.id==="adToggle"){const on=t.getAttribute("aria-pressed")!=="true";t.setAttribute("aria-pressed",on);document.body.classList.toggle("show-slots",on);toast(on?"Tap any outlined slot to buy it":"Ad slots hidden");return}
  if(t.dataset.save){ev.stopPropagation();const id=+t.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);store.set("pm_saved2",[...saved]);toast(saved.has(id)?"Saved to My Meetings":"Removed from My Meetings");
    if(!document.getElementById("sheet").hidden)openEvent(id);render();return}
  if(t.dataset.tab){state.tab=t.dataset.tab;store.set("pm_tab",state.tab);render();window.scrollTo(0,0);return}
  if(t.dataset.filter){state.filter=t.dataset.filter;render();return}
  if(t.dataset.open){openEvent(t.dataset.open);return}
  if(t.dataset.close!==undefined||t.id==="sheet"&&ev.target===t){closeSheet();return}
  if(t.dataset.goreview){closeSheet();state.tab="reviews";render();document.getElementById("rmeet").value=t.dataset.goreview;window.scrollTo(0,0);return}
  if(t.dataset.star){const n=+t.dataset.star;document.querySelectorAll(".star").forEach(s=>s.classList.toggle("on",+s.dataset.star<=n));document.getElementById("stars").dataset.v=n;return}
  if(t.dataset.ad!==undefined){toast("Sample placement. Advertiser link goes here.");return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open)openEvent(e.target.dataset.open)});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.id==="rate"){if(!document.getElementById("stars").dataset.v){toast("Pick a star rating first");return}toast("Thanks! Review submitted");e.target.reset();document.querySelectorAll(".star").forEach(s=>s.classList.remove("on"));delete document.getElementById("stars").dataset.v}
  if(e.target.id==="signup"){toast("You're on the list");e.target.reset()}
});
render();
</script>

</body></html>
